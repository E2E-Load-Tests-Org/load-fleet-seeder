# QRW-485 fleet load test: the seeding workflow.
#
# NOT active in this repository (GitLab never runs it). Install it, unchanged, as
# `.github/workflows/seed-fleet.yml` in the seeder repository of the load org
# (E2E-Load-Tests-Org/load-fleet-seeder, docs/load/README.md "Steps"). It is dispatched by
# `python scripts/load_fleet_seed.py seed --count N --yes`, which first creates each empty
# fleet repository and turns its Actions off; this job only clones a PUBLIC source onto the
# runner and pushes it into its fleet repository, so the data never passes through our
# machines.
#
# One matrix job per fleet repository. Idempotent: a repository whose marker branch exists
# is done and skipped; one that holds refs but no marker (an interrupted job) gets only
# its marker. Safe by construction: it refuses any org or source in Veeam-Cloud, any
# target org other than the one this workflow runs in, and any fleet repository whose
# Actions are still on.
name: seed-fleet

on:
  workflow_dispatch:
    inputs:
      slots:
        description: 'JSON list of {"name","source","chunk"} (at most 256), from load_fleet_seed.py'
        required: true
      max_parallel:
        description: 'Jobs at once (GitHub Free caps an account at 20 concurrent jobs)'
        default: '20'
      marker_branch:
        description: 'Branch of the unique marker commit'
        default: 'qa-fleet-marker'
      token_secret:
        description: 'Name of the Actions secret that can push (contents + workflows write, actions read)'
        default: 'LOAD_FLEET_PUSH_TOKEN'

permissions:
  contents: read

concurrency:
  group: seed-fleet-${{ github.run_id }}

jobs:
  push:
    name: ${{ matrix.slot.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        slot: ${{ fromJSON(inputs.slots) }}
    env:
      ORG: ${{ github.repository_owner }}
      NAME: ${{ matrix.slot.name }}
      SOURCE: ${{ matrix.slot.source }}
      CHUNK: ${{ matrix.slot.chunk }}
      MARKER: ${{ inputs.marker_branch }}
      # GITHUB_TOKEN cannot push to another repository, and no token may push workflow
      # files without the workflow permission: a PAT secret is required (trap b).
      TOKEN: ${{ secrets[inputs.token_secret] }}
    steps:
      - name: Mirror the source and add the marker commit
        shell: bash
        run: |
          set -euo pipefail
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          [ -n "$TOKEN" ] || { echo "::error::secret '${{ inputs.token_secret }}' is empty"; exit 1; }
          case "$(lower "$ORG")" in veeam-cloud) echo "::error::refusing org $ORG"; exit 1;; esac
          case "$(lower "${SOURCE%%/*}")" in veeam-cloud) echo "::error::refusing source $SOURCE"; exit 1;; esac
          [[ "$SOURCE" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::bad source $SOURCE"; exit 1; }
          [[ "$NAME" =~ ^[A-Za-z0-9_.-]+$ ]] || { echo "::error::bad name $NAME"; exit 1; }
          [[ "$CHUNK" =~ ^[0-9]+$ ]] || { echo "::error::bad chunk $CHUNK"; exit 1; }

          api() { printf 'Authorization: Bearer %s\n' "$TOKEN" | curl -fsS -H @- \
                    -H 'Accept: application/vnd.github+json' "https://api.github.com$1"; }
          # Trap a: the source's own .github/workflows must never run in the load org.
          enabled=$(api "/repos/$ORG/$NAME/actions/permissions" | python3 -c 'import sys,json;print(json.load(sys.stdin)["enabled"])')
          [ "$enabled" = "False" ] || { echo "::error::Actions are on in $ORG/$NAME; the seeder turns them off first"; exit 1; }

          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          g() { git -c "http.https://github.com/.extraheader=$auth" "$@"; }
          target="https://github.com/$ORG/$NAME.git"

          if g ls-remote --exit-code --heads "$target" "$MARKER" >/dev/null 2>&1; then
            echo "$NAME already carries $MARKER: done"; exit 0
          fi

          if [ -z "$(g ls-remote --heads "$target")" ]; then
            # --bare takes refs/heads and refs/tags only: never refs/pull/*, which GitHub
            # refuses to receive (hidden refs). The source is public: no credential.
            git clone --bare --quiet "https://github.com/$SOURCE.git" src.git
            cd src.git
            head=$(git symbolic-ref --short HEAD)
            if [ "$CHUNK" -gt 0 ]; then
              # Trap c: stay under the 2 GB push limit by pushing the default branch's
              # first-parent history in steps of CHUNK commits, oldest first.
              git rev-list --reverse --first-parent "$head" | awk -v n="$CHUNK" 'NR % n == 0' |
                while read -r sha; do g push --quiet "$target" "$sha:refs/heads/$head"; done
            fi
            g push --quiet "$target" "refs/heads/$head:refs/heads/$head"
            g push --quiet --all "$target"
            g push --quiet --tags "$target"
          else
            # Refs are there: an earlier job stopped before its marker. Fetch only the tip.
            git init --bare --quiet src.git
            cd src.git
            head=$(g ls-remote --symref "$target" HEAD | awk '/^ref:/ {sub("refs/heads/","",$2); print $2}')
            g fetch --quiet --depth 1 "$target" "refs/heads/$head:refs/heads/$head"
          fi

          # The marker: one small unique file on its own branch, on top of the default
          # branch, so no two fleet repositories are identical (trap e: its presence is
          # what marks the slot done).
          export GIT_AUTHOR_NAME=qa-fleet GIT_AUTHOR_EMAIL=qa-fleet@users.noreply.github.com
          export GIT_COMMITTER_NAME=qa-fleet GIT_COMMITTER_EMAIL=qa-fleet@users.noreply.github.com
          blob=$(printf '%s seeded from %s by run %s\n' "$NAME" "$SOURCE" "$GITHUB_RUN_ID" | git hash-object -w --stdin)
          export GIT_INDEX_FILE="$PWD/marker.index"
          git read-tree "refs/heads/$head"
          git update-index --add --cacheinfo "100644,$blob,qa-fleet-marker.txt"
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -p "refs/heads/$head" -m "QRW-485 fleet marker for $NAME")
          g push --quiet "$target" "$commit:refs/heads/$MARKER"
          echo "$NAME seeded from $SOURCE"
